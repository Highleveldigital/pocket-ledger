<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#07090b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#07090b;--card:#11161a;--card2:#161d22;--ink:#eef5f3;--mut:#7d8b88;--line:#1f292e;--acc:#34f5c5;--accs:#0f2e28;--bad:#ff7a59;--badS:#2e1610;--good:#34f5c5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 8px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:26px;margin:0}h2{font-size:17px;margin:0 0 10px}
main{padding:0 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:28px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.neg{color:var(--bad)}.pos{color:var(--good)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mut);font-size:11px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc)}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}
button.btn{background:var(--acc);color:#04201a;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600}
button.ghost{background:var(--accs);color:var(--acc);border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
button.x{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
input,select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--bad)}
.tip{background:var(--badS);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.tip.ok{background:var(--accs)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
button.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;font-size:30px;line-height:1;padding:0;box-shadow:0 4px 12px #0003}
#lock{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:24px}
#lock input{max-width:200px;text-align:center;font-size:28px;letter-spacing:8px}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border-radius:20px}
h1{letter-spacing:-.5px}
.hero{background:radial-gradient(120% 140% at 0% 0%,#1d5c4f 0%,#0e2a25 45%,#0b1214 100%);border:1px solid #23493f;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#34f5c540,transparent 70%)}
.hero .lbl{color:#9fd8c9;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.hero .amt{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:4px 0 2px;text-shadow:0 0 24px #34f5c555}
.hero .amt.neg{color:var(--bad);text-shadow:none}
.pills{display:flex;gap:8px;margin-top:14px}.pills div{flex:1;min-width:0;background:#ffffff0d;border-radius:12px;padding:8px 10px}
.pills span{display:block;font-size:12px;color:#9fd8c9}.pills b{font-size:16px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative;z-index:1}
.mnav button{background:#ffffff12;border:0;color:var(--ink);width:32px;height:32px;border-radius:16px;font-size:18px}
.ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--accs);flex:none}
.crow{display:flex;gap:12px;align-items:center;margin-bottom:14px}.crow>div:last-child{flex:1}
.bar{background:#ffffff10}.bar i{background:linear-gradient(90deg,#1fb894,var(--acc));box-shadow:0 0 10px #34f5c566}
.bar i.over{background:var(--bad);box-shadow:0 0 10px #ff7a5966}
nav{background:#0b0f12ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button.on b{text-shadow:0 0 12px var(--acc)}
button.fab{box-shadow:0 0 24px #34f5c566}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:18px 4px 8px}
.due{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.due:last-child{border:0}
.due .d{width:44px;text-align:center;background:var(--accs);border-radius:12px;padding:4px 0;font-size:11px;color:var(--acc)}.due .d b{display:block;font-size:18px;color:var(--ink)}
</style>
</head>
<body>
<div id="lock"><h1>🔒 Ledger</h1><p class="mut">Enter passcode</p><input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><p id="pinMsg" class="neg"></p></div>
<header><h1 id="title">Overview</h1><span class="mut" id="monthLbl"></span></header>
<main id="view"></main>
<button class="btn fab" id="fab" aria-label="Add transaction">+</button>
<nav>
 <button data-v="home" class="on"><b>◎</b>Overview</button>
 <button data-v="tx"><b>☰</b>Activity</button>
 <button data-v="bills"><b>🗓</b>Bills</button>
 <button data-v="budget"><b>▤</b>Budgets</button>
 <button data-v="save"><b>💡</b>Save</button>
 <button data-v="settings"><b>⚙︎</b>More</button>
</nav>
<dialog id="dlg"></dialog>
<script>
const KEY='ledger-v1';
const DEFAULT_CATS=['Groceries','Dining','Gas','Transport','Housing','Utilities','Phone & Internet','Subscriptions','Shopping','Health','Entertainment','Insurance','Debt','Other'];
const RULES={Groceries:/loblaw|no frills|sobeys|metro |food basics|superstore|freshco|save on|safeway|iga |maxi |provigo|farm boy|t&t|grocer|walmart|kroger|aldi|safeway|publix|trader joe|whole foods|costco|heb|food lion/i,Dining:/tim horton|a&w|harvey|skip ?the ?dishes|swiss chalet|boston pizza|restaurant|mcdonald|starbucks|chipotle|doordash|uber ?eats|grubhub|pizza|cafe|coffee|taco|burger|wendy|chick/i,Gas:/petro-?can|esso|husky|ultramar|pioneer|circle k|shell|exxon|chevron|bp |marathon|sunoco|speedway|fuel|gas/i,Transport:/uber|lyft|parking|toll|transit/i,Subscriptions:/netflix|spotify|hulu|disney|apple\.com|icloud|youtube|prime|patreon|audible|max\.com|paramount|subscription/i,'Phone & Internet':/rogers|bell |telus|fido|koodo|virgin|freedom mobile|videotron|shaw|verizon|at&t|t-mobile|comcast|xfinity|spectrum|internet/i,Utilities:/hydro|enbridge|fortis|electric|water|power|energy|utility|gas co/i,Shopping:/canadian tire|shoppers drug|winners|dollarama|amazon|target|best buy|ebay|etsy|shein|temu/i,Health:/pharmacy|cvs|walgreens|doctor|dental|clinic|gym|fitness/i,Entertainment:/steam|playstation|xbox|cinema|theater|ticket/i,Insurance:/intact|desjardins|td insur|insurance|geico|progressive|allstate|state farm/i};
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)return Object.assign({tx:[],bills:[],budgets:{},cats:DEFAULT_CATS.slice(),pin:null,pay:null},d)}catch(e){}return{tx:[],bills:[],budgets:{},cats:DEFAULT_CATS.slice(),pin:null,pay:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save: storage unavailable')}}
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const ym=d=>d.slice(0,7);
let curMonth=ym(today());
const monthName=m=>new Date(m+'-15').toLocaleDateString(undefined,{month:'long',year:'numeric'});
const addMonths=(m,k)=>{const d=new Date(m+'-15');d.setMonth(d.getMonth()+k);return d.toISOString().slice(0,7)};
const guessCat=t=>{for(const[c,r]of Object.entries(RULES))if(r.test(t))return c;return'Other'};
const monthTx=m=>S.tx.filter(t=>ym(t.date)===m);
function catTotals(m){const o={};for(const t of monthTx(m))if(t.type==='expense')o[t.cat]=(o[t.cat]||0)+t.amount;return o}
const ICON={Groceries:'🛒',Dining:'🍔',Gas:'⛽',Transport:'🚗',Housing:'🏠',Utilities:'💡','Phone & Internet':'📱',Subscriptions:'📺',Shopping:'🛍️',Health:'💊',Entertainment:'🎮',Insurance:'🛡️',Debt:'💳',Other:'📦'};
const ic=c=>ICON[c]||'🏷️';
const opts=(sel)=>S.cats.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');

/* ---------- views ---------- */
let view='home';
const V={};
/* ---------- paycheck engine ---------- */
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=s=>new Date(s+'T00:00:00');
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const fmtD=d=>d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const dayN=d=>Math.round((pd(iso(d))-pd(iso(new Date())))/864e5);
function stepPay(d,k){d=new Date(d);const f=S.pay.freq;
 if(f==='weekly'||f==='biweekly'){d.setDate(d.getDate()+k*(f==='weekly'?7:14));return d}
 if(f==='monthly'){const day=pd(S.pay.next).getDate();const t=new Date(d.getFullYear(),d.getMonth()+k,1);t.setDate(Math.min(day,dim(t.getFullYear(),t.getMonth())));return t}
 // semimonthly: 15th and last day of month
 for(let i=0;i<Math.abs(k);i++){const last=d.getDate()===dim(d.getFullYear(),d.getMonth());if(k>0)d=last?new Date(d.getFullYear(),d.getMonth()+1,15):new Date(d.getFullYear(),d.getMonth(),dim(d.getFullYear(),d.getMonth()));else d=last?new Date(d.getFullYear(),d.getMonth(),15):new Date(d.getFullYear(),d.getMonth(),0)}return d}
function anchor(){let a=pd(S.pay.next);if(S.pay.freq==='semimonthly'){a=a.getDate()<=15?new Date(a.getFullYear(),a.getMonth(),15):new Date(a.getFullYear(),a.getMonth(),dim(a.getFullYear(),a.getMonth()))}return a}
function period(offset=0){const t=pd(iso(new Date()));let s=anchor(),g=0;while(s>t&&g++<500)s=stepPay(s,-1);while(stepPay(s,1)<=t&&g++<1000)s=stepPay(s,1);if(offset)s=stepPay(s,offset);return{start:s,end:stepPay(s,1)}}
const FREQ={monthly:'Monthly',biweekly:'Every 2 weeks',weekly:'Every week'};
const bf=b=>b.freq||'monthly';
const monthlyAmt=b=>bf(b)==='weekly'?b.amount*52/12:bf(b)==='biweekly'?b.amount*26/12:b.amount;
const billKey=(b,d)=>bf(b)==='monthly'?iso(d).slice(0,7):iso(d);
function billDates(b,start,end){const out=[];if(bf(b)==='monthly'){for(let i=-1;i<15;i++){const t=new Date(start.getFullYear(),start.getMonth()+i,1);const d=new Date(t.getFullYear(),t.getMonth(),Math.min(b.day,dim(t.getFullYear(),t.getMonth())));if(d>=end)break;if(d>=start)out.push(d)}return out}
 const step=bf(b)==='weekly'?7:14,a=pd(b.start||iso(new Date()));const k=Math.ceil(Math.round((start-a)/864e5)/step);let d=new Date(a);d.setDate(d.getDate()+k*step);let g=0;while(d<end&&g++<200){if(d>=start)out.push(new Date(d));d.setDate(d.getDate()+step)}return out}
function billsIn(start,end){const out=[];for(const b of S.bills)for(const d of billDates(b,start,end)){const key=billKey(b,d);out.push({...b,date:d,key,paidNow:!!(b.paid&&b.paid[key])})}return out.sort((a,b)=>a.date-b.date)}
function nextDue(b){const t=pd(iso(new Date()));const s=new Date(t);s.setDate(s.getDate()-3);const e=new Date(t);e.setDate(e.getDate()+70);const ds=billDates(b,s,e);return ds.find(d=>d>=t)||null}
const billWhen=b=>bf(b)==='monthly'?`Monthly on the ${ord(b.day)}`:`${FREQ[bf(b)]}`;
const isBillTx=t=>t.bill||S.bills.some(b=>{const n=b.name.toLowerCase();return n.length>2&&(t.note||'').toLowerCase().includes(n)});
function periodStats(p){const s=iso(p.start),e=iso(p.end);const tx=S.tx.filter(t=>t.date>=s&&t.date<e);
 const got=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);const pay=got||S.pay.amount;
 const bills=billsIn(p.start,p.end),billTot=bills.reduce((a,b)=>a+b.amount,0);
 const save=S.pay.saveType==='pct'?pay*(S.pay.save||0)/100:(S.pay.save||0);
 const spendTx=tx.filter(t=>t.type==='expense'&&!isBillTx(t)),spent=spendTx.reduce((a,t)=>a+t.amount,0);
 const allow=pay-billTot-save;return{pay,got,bills,billTot,save,allow,spent,left:allow-spent,spendTx,tx}}
function editPay(){const p=S.pay||{amount:'',freq:'biweekly',next:iso(new Date()),save:10,saveType:'pct'};const d=$('#dlg');
 d.innerHTML=`<h2>Your paycheck</h2><label>Take-home pay per paycheck (after tax)</label><input id="pA" type="number" inputmode="decimal" value="${p.amount}" placeholder="e.g. 1850">
 <label>How often are you paid?</label><select id="pF">${[['weekly','Every week'],['biweekly','Every 2 weeks'],['semimonthly','Twice a month (15th & last day)'],['monthly','Once a month']].map(([v,l])=>`<option value="${v}" ${p.freq===v?'selected':''}>${l}</option>`).join('')}</select>
 <label>Date of a recent or upcoming payday</label>${dateSel('pN',p.next)}
 <label>Save &amp; invest from each paycheck</label><div class="row" style="gap:8px"><input id="pS" type="number" inputmode="decimal" value="${p.save}" style="flex:2"><select id="pT" style="flex:1"><option value="pct" ${p.saveType==='pct'?'selected':''}>% of pay</option><option value="amt" ${p.saveType==='amt'?'selected':''}>$ amount</option></select></div>
 <div class="row"><span></span><span><button class="ghost" onclick="dlg.close()">Cancel</button> <button class="btn" id="pSave">Save</button></span></div>`;
 $('#pSave').onclick=()=>{const a=parseFloat($('#pA').value);if(!(a>0)||!$('#pN').value)return alert('Enter your pay amount and a payday');S.pay={amount:a,freq:$('#pF').value,next:$('#pN').value,save:parseFloat($('#pS').value)||0,saveType:$('#pT').value};save();d.close();render()};d.showModal()}
function exportCalendar(){const st=n=>n.toISOString().replace(/[-:]/g,'').slice(0,8);const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pocket Ledger//EN','CALSCALE:GREGORIAN'];const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
 for(const b of S.bills){const first=nextDue(b)||new Date();const rr=bf(b)==='monthly'?`FREQ=MONTHLY;BYMONTHDAY=${b.day>=29?'-1':b.day}`:bf(b)==='weekly'?'FREQ=WEEKLY':'FREQ=WEEKLY;INTERVAL=2';L.push('BEGIN:VEVENT',`UID:bill-${b.id}@ledger`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${iso(first).replace(/-/g,'')}`,`RRULE:${rr}`,`SUMMARY:💸 ${b.name} – ${money(b.amount)}`,'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${b.name} comes out tomorrow (${money(b.amount)})`,'TRIGGER:-PT15H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${b.name} comes out today`,'TRIGGER:PT9H','END:VALARM','END:VEVENT')}
 if(S.pay){const f={weekly:'FREQ=WEEKLY',biweekly:'FREQ=WEEKLY;INTERVAL=2',monthly:'FREQ=MONTHLY',semimonthly:'FREQ=MONTHLY;BYMONTHDAY=15,-1'}[S.pay.freq];L.push('BEGIN:VEVENT','UID:payday@ledger',`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${iso(period().end).replace(/-/g,'')}`,`RRULE:${f}`,'SUMMARY:💰 Payday – open Ledger to plan this paycheck','TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Payday! Open Ledger to see your plan','TRIGGER:PT9H','END:VALARM','END:VEVENT')}
 L.push('END:VCALENDAR');const blob=new Blob([L.join('\r\n')],{type:'text/calendar'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledger-bills.ics';document.body.appendChild(a);a.click();a.remove()}
function paycheckCard(){if(!S.pay)return `<div class="card hero"><div class="lbl">Paycheck plan</div><div style="font-size:22px;font-weight:700;margin:6px 0 10px">Tell me about your pay</div><p style="color:#9fd8c9;margin:0 0 14px">Each payday, Ledger shows what to set aside for bills until your next check, what to save and invest, and what's safe to spend.</p><button class="btn" onclick="editPay()">Set up my paycheck</button></div>`;
 const p=period(),st=periodStats(p),daysLeft=Math.max(1,dayN(p.end)),perDay=st.left/daysLeft,used=st.allow>0?Math.min(100,st.spent/st.allow*100):100;
 const billsLeft=st.bills.filter(b=>dayN(b.date)>=0).reduce((a,b)=>a+b.amount,0);
 return `<div class="card hero"><div class="mnav"><span class="lbl">This paycheck · ${p.start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${new Date(p.end-864e5).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><button onclick="editPay()" aria-label="Edit paycheck" style="font-size:14px">✎</button></div>
 <div class="lbl" style="margin-top:4px">Safe to spend</div><div class="amt ${st.left<0?'neg':''}">${money(st.left)}</div>
 <div style="color:#9fd8c9;font-size:14px">${st.left>=0?`About ${money(perDay)}/day for ${daysLeft} more day${daysLeft>1?'s':''} · next payday ${fmtD(p.end)}`:`Over by ${money(-st.left)}. Cut back until ${fmtD(p.end)}.`}</div>
 <div class="bar" style="margin-top:12px"><i class="${st.left<0?'over':''}" style="width:${used}%"></i></div>
 <div class="pills"><div><span>Paycheck</span><b>${money(st.pay)}</b></div><div><span>Bills</span><b>${money(st.billTot)}</b></div><div><span>Save/invest</span><b>${money(st.save)}</b></div></div></div>
 <div class="sec">Your paycheck, broken down</div>
 <div class="card">
  <div class="row"><span>💰 Paycheck${st.got?'':' <span class="mut">(expected)</span>'}</span><b>${money(st.pay)}</b></div>
  <div class="row" style="margin-top:8px"><span>🧾 Bills before next payday</span><b class="neg">−${money(st.billTot)}</b></div>
  <div class="row" style="margin-top:8px"><span>📈 Save &amp; invest</span><b class="neg">−${money(st.save)}</b></div>
  <div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span>🛍️ Spending money</span><b>${money(st.allow)}</b></div>
  <div class="row" style="margin-top:8px"><span>Spent so far (not bills)</span><b class="neg">−${money(st.spent)}</b></div>
  <div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><b>Left over</b><b class="${st.left<0?'neg':'pos'}">${money(st.left)}</b></div>
  ${st.allow<0?`<div class="tip" style="margin:12px 0 0">Bills plus savings are more than this paycheck. Lower the savings amount, or set aside part of the previous paycheck for these bills.</div>`:''}
 </div>
 <div class="sec">Bills coming out this paycheck${billsLeft&&billsLeft<st.billTot?` · ${money(billsLeft)} still to come out`:''}</div>
 <div class="card">${st.bills.length?st.bills.map(b=>`<div class="due"><div class="d">${b.date.toLocaleDateString(undefined,{month:'short'})}<b>${b.date.getDate()}</b></div><div style="flex:1">${esc(b.name)}<br><span class="mut">${(()=>{const n=dayN(b.date);return n<0?`Came out ${-n} day${n<-1?'s':''} ago`:n===0?'Comes out today':`Comes out in ${n} day${n>1?'s':''}`})()}</span></div><div style="text-align:right"><b>${money(b.amount)}</b></div></div>`).join(''):`<p class="mut" style="margin:0">${S.bills.length?'No bills come out before your next payday 🎉':'Add your bills on the Bills tab and they will show up here.'}</p>`}</div>`}

function parseBills(text){
 text=text.replace(/^\s*\|?\s*:?-{2,}.*$/gm,'').replace(/\*\*/g,'');
 const a=parseLines(text);
 // tables copied cell-by-cell: regroup lines into rows
 const HDR=/^(bills?|names?|amount|cost|price|due( date| day)?|date|day|category|type|frequency|how often|notes?|payment|account|company)$/i;
 const SOFT=new RegExp('^('+S.cats.map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+'|monthly|weekly|bi-?weekly|yearly|annually|auto.?pay|manual|yes|no|-)$','i');
 const rows=[];let cur=null;
 for(let l of text.split(/\r?\n/)){l=l.replace(/^\||\|$/g,'').trim();if(!l||HDR.test(l))continue;
  const hasNum=/\d/.test(l);
  if(!hasNum&&SOFT.test(l)){if(cur&&/week|fortnight/i.test(l))cur.t+=' | '+l;continue}
  if(!hasNum&&(!cur||cur.num)){cur={t:l,num:false};rows.push(cur)}
  else if(cur){cur.t+=' | '+l;if(hasNum)cur.num=true}else{cur={t:l,num:true};rows.push(cur)}}
 const b=parseLines(rows.map(r=>r.t).join('\n'));
 const score=x=>x.length*2-x.filter(y=>y.dayGuess).length;
 const best=score(b)>score(a)?b:a;
 return best.filter(x=>!/^total/i.test(x.name))}
function parseLines(text){const out=[];
 for(let line of text.split(/\r?\n/)){line=line.trim();if(!line)continue;
  const nums=[];const re=/(\$\s?)?(\d{1,3}(?:,\d{3})+|\d+)(\.\d{1,2})?\s*(st|nd|rd|th)?\b/gi;let m;
  // month-name dates like "Nov 15" / "15 Nov" / "11/15"
  let day=null;const md=line.match(/\b(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b|(?<![\d.,$])\b(\d{1,2})\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i);
  const sl=line.match(/\b(\d{1,2})\/(\d{1,2})(?:\/\d{2,4})?\b/);
  let rest=line.replace(/\b(bi-?weekly|every (2|two|other) weeks?|every week|fortnightly|weekly)\b/gi,' ');if(md&&+(md[1]||md[2])<=31){day=+(md[1]||md[2]);rest=rest.replace(md[0],' ')}else if(sl&&+sl[2]<=31&&+sl[1]<=12){day=+sl[2];rest=rest.replace(sl[0],' ')}
  while((m=re.exec(rest)))nums.push({raw:m[0],val:parseFloat(m[2].replace(/,/g,'')+(m[3]||'')),money:!!m[1]||!!m[3]||m[2].includes(','),ord:!!m[4],i:m.index});
  if(!nums.length)continue;let amt=nums.find(n=>n.money);
  if(day==null){const o=nums.find(n=>n.ord&&n.val>=1&&n.val<=31);if(o)day=o.val}
  if(!amt){const c=nums.filter(n=>!n.ord&&!(day!=null&&n.val===day&&n.val<=31));amt=c.length>1?c.reduce((a,b)=>b.val>a.val?b:a):c[0];if(!amt)continue}
  if(day==null){const d=nums.filter(n=>n!==amt&&n.val>=1&&n.val<=31&&Number.isInteger(n.val));if(d.length)day=d[d.length-1].val}
  let name=rest;for(const n of nums)if(n===amt||(day!=null&&n.val===day))name=name.replace(n.raw,' ');
  name=name.replace(/\b(due|on|the|every|monthly|per month|\/mo|a month|cad|usd|amount|day)\b/gi,' ').replace(/[|\t:;,$–—-]+/g,' ').replace(/\s+/g,' ').trim();
  if(!name||!(amt.val>0))continue;
  const freq=/bi-?weekly|every (2|two|other) weeks?|fortnight/i.test(line)?'biweekly':/\bweekly|every week/i.test(line)?'weekly':'monthly';
  let start=null;const MO='janfebmaraprmayjunjulaugsepoctnovdec';if(md){const mn=line.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i)[1].toLowerCase();start=new Date(new Date().getFullYear(),MO.indexOf(mn)/3,day)}else if(sl&&day)start=new Date(new Date().getFullYear(),+sl[1]-1,day);
  if(start&&start<new Date(Date.now()-60*864e5))start.setFullYear(start.getFullYear()+1);
  name=name.replace(/\b(bi-?weekly|weekly|every (2|two|other) weeks?|every week|fortnightly|biweekly)\b/gi,' ').replace(/\s+/g,' ').trim();if(!name)continue;
  out.push({name:name.replace(/^\w/,c=>c.toUpperCase()),amount:amt.val,day:day||1,freq,start:start?iso(start):undefined,dayGuess:freq==='monthly'?!day:!start,cat:billCat(name)})}
 return out}
function billCat(n){if(/rent|mortgage|condo|strata/i.test(n))return'Housing';if(/insur/i.test(n))return'Insurance';if(/hydro|electric|enbridge|gas bill|water|utilit|fortis/i.test(n))return'Utilities';if(/phone|cell|mobile|internet|wifi|rogers|bell|telus|fido|koodo|virgin|freedom|shaw/i.test(n))return'Phone & Internet';if(/loan|credit|card|visa|mastercard|amex|line of credit|loc|payment/i.test(n))return'Debt';if(/gym|fitness/i.test(n))return'Health';if(/car|lease|auto|transit|presto/i.test(n))return'Transport';const g=guessCat(n);return g==='Other'&&/netflix|spotify|prime|disney|crave|apple|google|youtube|xbox|playstation/i.test(n)?'Subscriptions':g}

let _ocr;function loadOCR(){return _ocr||(_ocr=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=res;sc.onerror=()=>{_ocr=null;rej(new Error('load'))};document.head.appendChild(sc)}))}
function prepImage(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const sc=Math.min(2,2400/Math.max(img.width,img.height))||1;const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
 const d=x.getImageData(0,0,c.width,c.height),p=d.data;let sum=0;for(let i=0;i<p.length;i+=4)sum+=p[i]*.3+p[i+1]*.59+p[i+2]*.11;const dark=sum/(p.length/4)<128;
 for(let i=0;i<p.length;i+=4){let g=p[i]*.3+p[i+1]*.59+p[i+2]*.11;if(dark)g=255-g;g=g>170?255:g<90?0:g;p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);URL.revokeObjectURL(img.src);res(c)};img.onerror=rej;img.src=URL.createObjectURL(file)})}
async function readBillPhoto(file){if(!file)return;const msg=$('#pbMsg'),go=$('#pbGo');go.disabled=true;
 try{msg.textContent='Getting the text reader ready (first time only)…';await loadOCR();
  msg.textContent='Reading your picture on this phone…';const canvas=await prepImage(file);
  const w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')msg.textContent=`Reading your picture… ${Math.round(m.progress*100)}%`}});
  await w.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});
  const {data}=await w.recognize(canvas);await w.terminate();
  const text=data.text.replace(/[|¦]/g,' | ').replace(/[“”]/g,'"').replace(/(\d) ?[,.] ?(\d\d)\b/g,'$1.$2').replace(/\bS(\d)/g,'$$$1');
  $('#pbT').value=text.trim();const list=parseBills(text);
  if(list.length)reviewBills(list);else msg.textContent="I couldn't find bills in that picture. Check the text above, fix it, and tap Read bills."}
 catch(e){msg.textContent=e.message==='load'?'Could not download the text reader. Connect to the internet once and try again.':'Something went wrong reading that picture. Try a clearer screenshot.'}
 finally{go.disabled=false}}
function reviewBills(list){const d=$('#dlg');d.innerHTML=`<h2>Check these ${list.length} bills</h2><p class="mut" style="margin-top:0">Fix anything that's off, then add them.</p>
 <div style="max-height:55vh;overflow:auto">${list.map((b,i)=>`<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px"><div class="row"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px"><input type="checkbox" id="rk${i}" checked style="width:20px;margin:0"> Add</label>${b.dayGuess?'<span class="mut" style="color:var(--bad)">Check the date</span>':''}</div>
 <input id="rn${i}" value="${esc(b.name)}"><label>Amount</label><input id="ra${i}" type="number" inputmode="decimal" value="${b.amount}">${freqFields('r'+i,b)}<select id="rc${i}" style="margin-bottom:0">${opts(b.cat)}</select></div>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="ghost" onclick="pasteBills()">Back</button><button class="btn" id="rbAdd">Add bills</button></div>`;
 $('#rbAdd').onclick=()=>{let n=0;list.forEach((b,i)=>{if(!$('#rk'+i).checked)return;const a=parseFloat($('#ra'+i).value),name=$('#rn'+i).value.trim();if(!name||!(a>0))return;S.bills.push({id:uid(),paid:{},name,amount:a,cat:$('#rc'+i).value,...readFreq('r'+i)});n++});save();d.close();view='bills';render();alert(`Added ${n} bill${n===1?'':'s'}.`)}}
/* ---------- budgets & categories ---------- */
function setBudget(c,v){const n=parseFloat(v);if(n>0)S.budgets[c]=n;else delete S.budgets[c];save();render()}
function addCat(){const v=$('#newCat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();render()}}

/* ---------- insights ---------- */
function insights(){const tips=[],m=ym(today()),prev=addMonths(m,-1),ct=catTotals(m),cp=catTotals(prev);
 const day=new Date().getDate(),dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
 for(const[c,b]of Object.entries(S.budgets)){const v=ct[c]||0;if(v>b)tips.push({html:`<b>${esc(c)}</b> is over budget by ${money(v-b)} this month.`});else{const proj=v/day*dim;if(day>5&&proj>b*1.05)tips.push({html:`At this pace, <b>${esc(c)}</b> will hit about ${money(proj)}, which is over your ${money(b)} budget. Slowing down by ${money((proj-b)/(dim-day||1))}/day keeps you on track.`})}}
 // recurring charges / subscriptions
 const byName={};for(const t of S.tx)if(t.type==='expense'&&t.note){const k=t.note.toLowerCase().replace(/[^a-z]/g,'').slice(0,14);if(!k)continue;(byName[k]=byName[k]||{name:t.note,months:{},amts:[]});byName[k].months[ym(t.date)]=true;byName[k].amts.push(t.amount)}
 const subs=Object.values(byName).filter(x=>Object.keys(x.months).length>=2&&Math.max(...x.amts)-Math.min(...x.amts)<=Math.max(2,Math.min(...x.amts)*0.15)&&!S.bills.some(b=>b.name.toLowerCase()===x.name.toLowerCase()));
 if(subs.length){const tot=subs.reduce((a,s)=>a+s.amts[s.amts.length-1],0);tips.push({html:`<b>Recurring charges found:</b> ${subs.map(s=>esc(s.name)+' ('+money(s.amts[s.amts.length-1])+')').join(', ')}. That adds up to ${money(tot)}/month, or ${money(tot*12)}/year. Cancel any you don't use.`})}
 for(const x of Object.values(byName)){const a=x.amts;if(a.length>=2&&a[a.length-1]>a[a.length-2]*1.05&&Object.keys(x.months).length>=2&&a[a.length-1]-a[a.length-2]>=1)tips.push({html:`<b>${esc(x.name)}</b> went up from ${money(a[a.length-2])} to ${money(a[a.length-1])}. It might be worth calling to negotiate or shopping around.`})}
 for(const[c,v]of Object.entries(ct)){const p=cp[c]||0;if(p>20&&v>p*1.3)tips.push({html:`<b>${esc(c)}</b> spending is up ${Math.round((v/p-1)*100)}% vs last month (${money(v)} vs ${money(p)}).`})}
 const din=S.tx.filter(t=>t.cat==='Dining'&&ym(t.date)===m);if(din.length>=6){const s=din.reduce((a,t)=>a+t.amount,0);tips.push({html:`You ate out <b>${din.length} times</b> this month (${money(s)}). Cooking even a third of those meals at home could save about ${money(s/3)}/month.`})}
 const inc=monthTx(prev).filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),exp=monthTx(prev).filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
 if(inc>0){const r=(inc-exp)/inc;tips.push({ok:r>=0.2,html:`Last month you saved <b>${Math.round(r*100)}%</b> of your income (${money(inc-exp)}). ${r>=0.2?'Great job, you beat the common 20% target.':'A common goal is 20%. Set budgets on your top categories to get there.'}`})}
 const billTot=S.bills.reduce((a,b)=>a+monthlyAmt(b),0);if(billTot&&inc)tips.push({ok:true,html:`Fixed bills are ${money(billTot)}/month, which is ${Math.round(billTot/inc*100)}% of last month's income.`});
 return tips}

/* ---------- CSV import ---------- */
function parseCSV(text){const rows=[];let r=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
function toDate(s){s=s.trim();let m;if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/)){let y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10)}
const num=s=>{if(s==null)return NaN;s=String(s).trim();const neg=/^\(.*\)$/.test(s)||/^-/.test(s.replace(/[$\s]/g,''));const n=parseFloat(s.replace(/[^0-9.]/g,''));return isNaN(n)?NaN:neg?-n:n};
function importCSV(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{const rows=parseCSV(rd.result);if(rows.length<2)return alert('That file looks empty.');
 const h=rows[0].map(x=>x.toLowerCase().trim()),f=re=>h.findIndex(x=>re.test(x));
 const iD=f(/date/),iDesc=f(/desc|payee|merchant|name|memo|details/),iDesc2=f(/description 2/),iA=f(/^amount|amount$|^cad\$|^usd\$/),iDr=f(/debit|withdraw/),iCr=f(/credit|deposit/),iT=f(/^type$|transaction type/);
 if(iD<0||(iA<0&&iDr<0))return alert('Could not find Date and Amount columns in this CSV.');
 const seen=new Set(S.tx.map(t=>t.date+'|'+t.amount+'|'+(t.note||'').toLowerCase()));let added=0,skipped=0;
 // decide sign convention: if most amounts are positive and there is no debit column, look at a type column
 for(const r of rows.slice(1)){const date=toDate(r[iD]||'');if(!date)continue;let a;
  if(iA>=0){a=num(r[iA]);if(iT>=0&&/debit|sale|purchase|withdraw/i.test(r[iT]||''))a=-Math.abs(a);if(iT>=0&&/credit|deposit|payment|refund/i.test(r[iT]||''))a=Math.abs(a)}
  else{const d=num(r[iDr]),c=num(r[iCr]);a=!isNaN(d)&&d!==0?-Math.abs(d):c}
  if(isNaN(a)||a===0)continue;const note=((iDesc>=0?r[iDesc]:'')+' '+(iDesc2>=0&&iDesc2!==iDesc?r[iDesc2]:'')).trim().replace(/\s+/g,' ').slice(0,60);
  const t={id:uid(),date,amount:Math.round(Math.abs(a)*100)/100,type:a<0?'expense':'income',note,cat:a<0?guessCat(note):'Other'};
  const k=t.date+'|'+t.amount+'|'+note.toLowerCase();if(seen.has(k)){skipped++;continue}seen.add(k);S.tx.push(t);added++}
 const mine=S.tx.slice(-added);if(added&&mine.every(t=>t.type==='income')&&confirm(`All ${added} rows came in as income. Many credit card exports list purchases as positive numbers. Treat them as expenses instead?`))for(const t of mine){t.type='expense';t.cat=guessCat(t.note)}
 save();alert(`Imported ${added} transactions${skipped?`, skipped ${skipped} duplicates`:''}. Tap any one to fix its category.`);view='tx';render()};rd.readAsText(file)}

/* ---------- backup / pin / wipe ---------- */
function exportBackup(){const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ledger-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}
function restoreBackup(file){if(!file)return;file.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.tx))throw 0;if(!confirm('Replace all current data with this backup?'))return;S=Object.assign(load(),d);save();render();alert('Backup restored.')}catch(e){alert('That is not a valid backup file.')}})}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ledger:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function setPin(){const p=prompt('New passcode (4–8 digits). Leave blank to remove.');if(p===null)return;if(!p){S.pin=null;save();render();return}if(!/^\d{4,8}$/.test(p))return alert('Use 4–8 digits.');if(prompt('Enter it again')!==p)return alert("Didn't match.");S.pin=await hash(p);save();render();alert('Passcode set. You will need it each time the app opens.')}
function wipe(){if(confirm('Erase ALL data on this device? This cannot be undone. Export a backup first if unsure.')&&confirm('Really erase everything?')){S={tx:[],bills:[],budgets:{},cats:DEFAULT_CATS.slice(),pin:null,pay:null};save();render()}}
function lock(){if(!S.pin)return;$('#lock').style.display='flex';$('#pinIn').value='';$('#pinIn').focus()}
$('#pinIn').oninput=async e=>{const v=e.target.value;if(v.length>=4&&await hash(v)===S.pin){$('#lock').style.display='none';$('#pinMsg').textContent=''}else if(v.length>=8)$('#pinMsg').textContent='Wrong passcode'};
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(Date.now()-hiddenAt>60000)lock()});

$('#monthLbl').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
render();lock();
if('serviceWorker' in navigator){let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;const doReload=()=>{if(reloaded)return;if(document.getElementById('dlg').open){document.getElementById('dlg').addEventListener('close',doReload,{once:true});return}reloaded=true;location.reload()};navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)doReload()});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{})}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
